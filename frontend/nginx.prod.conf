# Server aset frontend di container deployment, diakses melalui proxy nginx utama.
# Fallback index.html mendukung deep link route React; aset ber-hash memakai cache immutable.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
