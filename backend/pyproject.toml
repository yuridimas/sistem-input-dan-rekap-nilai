# Manifest package backend dan konfigurasi pytest untuk API/worker.
# Extra dev memuat alat test; template HTML disertakan agar renderer bekerja dari package.
[project]
name = "sistem-input-rekap-nilai-backend"
version = "0.1.0"
description = "Backend for grade input & recap system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pydantic-settings>=2.4",
  "alembic>=1.13",
  "celery>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "slowapi>=0.1.9",
  "weasyprint==70.0",
  "Jinja2==3.1.6",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pypdf==6.21.2",
]
seed = [
  "polyfactory==2.22.5",
  "Faker==40.44.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]
