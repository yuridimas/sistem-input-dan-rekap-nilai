# Proxy deployment untuk browser: /api menuju FastAPI, path lain menuju frontend.
# TLS berada di proxy eksternal; header forwarded diteruskan untuk konteks request aplikasi.
# TLS terminates at the external reverse proxy. Forward its X-Forwarded-Proto header here.
upstream grade_api {
    server backend-deploy:8000;
}

upstream grade_frontend {
    server frontend-deploy:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        # Slash akhir menghapus prefix /api/ karena route FastAPI terdaftar tanpa prefix itu.
        proxy_pass http://grade_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://grade_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
